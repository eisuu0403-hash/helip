<nav><button data-t="cur" class="on">換算</button><button data-t="plan">プラン</button><button data-t="tr">翻訳</button><button data-t="set">その他</button></nav>

<script>
const CUR=[["USD","米ドル",150],["EUR","ユーロ",165],["GBP","英ポンド",195],["CNY","中国元",21],["AUD","豪ドル",98],["CAD","カナダドル",108],["CHF","スイスフラン",185],["HKD","香港ドル",19.3],["SGD","シンガポールドル",115],["SEK","スウェーデンクローナ",14.5],["KRW","韓国ウォン",0.108],["NOK","ノルウェークローネ",14],["NZD","NZドル",88],["INR","インドルピー",1.8],["MXN","メキシコペソ",8],["TWD","台湾ドル",4.7],["ZAR","南アフリカランド",8.3],["BRL","ブラジルレアル",27],["DKK","デンマーククローネ",22],["THB","タイバーツ",4.4]];
const LANG=[["英語","en-US"],["中国語","zh-CN"],["ヒンディー語","hi-IN"],["スペイン語","es-ES"],["フランス語","fr-FR"],["アラビア語","ar-SA"],["ベンガル語","bn-BD"],["ポルトガル語","pt-BR"],["ロシア語","ru-RU"],["ウルドゥー語","ur-PK"],["インドネシア語","id-ID"],["ドイツ語","de-DE"],["パンジャブ語","pa-IN"],["スワヒリ語","sw-KE"],["トルコ語","tr-TR"],["ベトナム語","vi-VN"],["イタリア語","it-IT"],["韓国語","ko-KR"],["タイ語","th-TH"],["フィリピン語","fil-PH"]];
const $=i=>document.getElementById(i);
function ld(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

// tabs
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
 document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x===b));
 ["cur","plan","tr","set"].forEach(t=>$("t-"+t).classList.toggle("hide",t!==b.dataset.t));
});

// currency
let rates=ld("rates",{});
$("cur").innerHTML=CUR.map(c=>`<option value="${c[0]}">${c[0]} ${c[1]}</option>`).join("");
$("cur").value=ld("cur","USD");
const CTY=[["アメリカ","USD"],["ドイツ","EUR"],["フランス","EUR"],["イタリア","EUR"],["スペイン","EUR"],["オランダ","EUR"],["ポルトガル","EUR"],["ギリシャ","EUR"],["イギリス","GBP"],["中国","CNY"],["オーストラリア","AUD"],["カナダ","CAD"],["スイス","CHF"],["香港","HKD"],["シンガポール","SGD"],["スウェーデン","SEK"],["韓国","KRW"],["ノルウェー","NOK"],["ニュージーランド","NZD"],["インド","INR"],["メキシコ","MXN"],["台湾","TWD"],["南アフリカ","ZAR"],["ブラジル","BRL"],["デンマーク","DKK"],["タイ","THB"]];
const FL=["🇺🇸","🇩🇪","🇫🇷","🇮🇹","🇪🇸","🇳🇱","🇵🇹","🇬🇷","🇬🇧","🇨🇳","🇦🇺","🇨🇦","🇨🇭","🇭🇰","🇸🇬","🇸🇪","🇰🇷","🇳🇴","🇳🇿","🇮🇳","🇲🇽","🇹🇼","🇿🇦","🇧🇷","🇩🇰","🇹🇭"];
$("cty").innerHTML='<option value="">選択してください</option>'+CTY.map((c,i)=>`<option value="${i}">${FL[i]} ${c[0]}(${c[1]})</option>`).join("");
function syncCty(){const v=$("cty").value;if(v===""||CTY[v][1]!==$("cur").value){const i=CTY.findIndex(c=>c[1]===$("cur").value);$("cty").value=i>=0?i:""}}
$("cty").onchange=()=>{if($("cty").value!==""){$("cur").value=CTY[$("cty").value][1];sv("cur",$("cur").value);loadRate()}};
function defRate(){return CUR.find(c=>c[0]===$("cur").value)[2]}
function curRate(){return rates[$("cur").value]??defRate()}
function calc(){
 const r=parseFloat($("rate").value)||0,a=parseFloat($("amt").value)||0;
 $("res").textContent="¥"+Math.round(a*r).toLocaleString("ja-JP");
 $("rn").textContent=a?`${a.toLocaleString()} ${$("cur").value} × ${r} 円`:"";
}
function loadRate(){$("rate").value=curRate();calc()}
$("cur").onchange=()=>{sv("cur",$("cur").value);syncCty();loadRate()};
$("amt").oninput=calc;
$("rate").oninput=()=>{const v=parseFloat($("rate").value);if(v>0){rates[$("cur").value]=v;sv("rates",rates)}calc()};
$("rst").onclick=()=>{delete rates[$("cur").value];sv("rates",rates);loadRate()};
syncCty();loadRate();

// spending total
let spend=ld("spend",[]);
function renderSpend(){
 $("sptot").textContent="¥"+spend.reduce((a,x)=>a+x.yen,0).toLocaleString("ja-JP");
 $("splist").innerHTML=spend.length?spend.slice().reverse().map(x=>`<div class="sp"><span>${x.amt.toLocaleString()} ${x.cur}</span><b>¥${x.yen.toLocaleString("ja-JP")}</b><button class="del" data-sd="${x.id}">削除</button></div>`).join(""):'<p class="note">金額を入力して「確定」を押すと、ここに追加されます。</p>';
}
$("spadd").onclick=()=>{
 const a=parseFloat($("amt").value),r=parseFloat($("rate").value);
 if(!(a>0)||!(r>0)){$("amt").style.borderColor="#ef4444";$("amt").focus();return}
 $("amt").style.borderColor="";
 spend.push({id:Date.now(),cur:$("cur").value,amt:a,rate:r,yen:Math.round(a*r)});
 sv("spend",spend);$("amt").value="";calc();renderSpend();
};
$("splist").onclick=e=>{const id=e.target.dataset.sd;if(id){spend=spend.filter(x=>x.id!=id);sv("spend",spend);renderSpend()}};
$("spclr").onclick=async()=>{if(spend.length&&await askConfirm("使った金額の合計をリセットしますか?","リセット")){spend=[];sv("spend",spend);renderSpend()}};
renderSpend();

// plans (旅 > 日 > 時間+プラン名)
let trip=ld("trip",{name:"",days:[{id:1,date:"",items:[]}]});
function save(){sv("trip",trip)}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function dayLabel(n){
 const m=/^(\d+)-(\d+)-(\d+)$/.exec(trip.days[0].date||"");if(!m)return "";
 const d=new Date(+m[1],+m[2]-1,+m[3]+n);
 return (d.getMonth()+1)+"月"+d.getDate()+"日("+"日月火水木金土"[d.getDay()]+")";
}
const W=92,planePos={};
function animTracks(sc){
 const wrap=$("trkwrap"),items=[];
 trip.days.forEach(d=>d.items.forEach(i=>items.push(i)));
 if(!items.length){wrap.innerHTML="";wrap.className="";return}
 const k=items.map(i=>i.done).lastIndexOf(true),x=k<0?22:k*W+W/2,old=planePos.all??x;
 let h="";
 trip.days.forEach((d,n)=>{if(!d.items.length)return;
  h+=`<div class="grp"><span class="dlab"><em>DAY ${n+1}</em></span>`+d.items.map(i=>`<div class="cp ${i.done?"done":""}" data-cp="${i.id}"><span class="dot"></span><b>${i.time||"--:--"}</b><i>${esc(i.title)}</i></div>`).join("")+`</div>`});
 wrap.className="card tw";
 wrap.innerHTML=`<div class="trk"><div class="tin" style="width:${items.length*W}px"><div class="ln"></div><div class="lf" style="width:${old}px"></div><svg class="pln" style="left:${old}px" viewBox="0 0 30 34" aria-label="キャリーケース"><path d="M10 9V4.5Q10 2 12.5 2h5Q20 2 20 4.5V9" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><rect x="3" y="8" width="24" height="20" rx="5"/><rect x="3" y="16" width="24" height="3" fill="var(--a2)"/><rect x="9" y="11" width="2.6" height="14" rx="1.3" fill="var(--card)"/><rect x="18.4" y="11" width="2.6" height="14" rx="1.3" fill="var(--card)"/><circle cx="9" cy="31" r="2.6"/><circle cx="21" cy="31" r="2.6"/></svg>${h}</div></div>`;
 const el=wrap.firstChild,pl=el.querySelector(".pln"),lf=el.querySelector(".lf");
 el.scrollLeft=sc.all||0;
 if(!("all" in sc))el.scrollLeft=Math.max(0,x-el.clientWidth/2);
 if(old!==x){requestAnimationFrame(()=>requestAnimationFrame(()=>{pl.style.left=x+"px";lf.style.width=x+"px";el.scrollTo({left:Math.max(0,x-el.clientWidth/2),behavior:"smooth"})}))}
 planePos.all=x;
}
$("trkwrap").onclick=e=>{
 const cp=e.target.closest("[data-cp]");if(!cp)return;
 for(const d of trip.days){const it=d.items.find(i=>i.id==cp.dataset.cp);if(it){it.done=!it.done;save();renderDays();return}}
};
function renderDays(){
 const sc={};document.querySelectorAll(".trk").forEach(e=>sc.all=e.scrollLeft);
 $("tname").value=trip.name;
 $("days").innerHTML=trip.days.map((d,n)=>{
  d.items.sort((x,y)=>(x.time||"99:99").localeCompare(y.time||"99:99"));
  const dn=d.items.filter(i=>i.done).length,dl=dayLabel(n);
  return `<div class="card day c${n%3}" data-day="${d.id}">
  <div class="band"><span class="badge">DAY ${n+1}</span><span class="dt">${dl}</span><span class="prog">${d.items.length?`${dn}/${d.items.length} 完了`:""}</span><button class="minus" data-dd="${d.id}" aria-label="この日を削除">−</button></div>
  <div class="bd">
  ${n===0?`<label>出発日</label><input type="date" data-date="${d.id}" value="${d.date||""}">`:""}
  <div class="plans">${d.items.map(i=>`<div class="pl ${i.done?"done":""}"><input type="time" class="tm ${i.time?"":"empty"}" data-tm="${i.id}" value="${i.time||""}" aria-label="時間を変更"><div class="nm"><b>${esc(i.title)}</b><button class="del" data-di="${i.id}">削除</button></div><input type="checkbox" class="ck" data-c="${i.id}" ${i.done?"checked":""} aria-label="完了"><div class="ph">${(i.photos||[]).map(q=>`<img class="th" data-ph="${q}" alt="写真">`).join("")}<button class="ghost sm" data-pc="${i.id}">撮影</button><button class="ghost sm" data-pp="${i.id}">写真を選ぶ</button></div></div>`).join("")||'<p class="note">この日のプランはまだありません。</p>'}</div>
  <div style="margin-top:12px"><button data-add="${d.id}" style="width:100%">+ プランを追加</button></div>
  </div></div>`}).join("");
 animTracks(sc);
 fillPhotos();
}
function findDay(el){const c=el.closest("[data-day]");return c&&trip.days.find(d=>d.id==c.dataset.day)}
$("days").onclick=async e=>{
 const t=e.target,d=findDay(t);if(!d)return;
 const cp=t.closest("[data-cp]");if(cp){const it=d.items.find(i=>i.id==cp.dataset.cp);it.done=!it.done;save();renderDays();return}
 if(t.dataset.add){openSheet(d.id)}
 if(t.dataset.c){d.items.find(i=>i.id==t.dataset.c).done=t.checked;save();renderDays()}
 if(t.dataset.pc){phTarget=t.dataset.pc;$("fphc").click()}
 if(t.dataset.pp){phTarget=t.dataset.pp;$("fphp").click()}
 if(t.dataset.ph){showPhoto(t.dataset.ph)}
 if(t.dataset.di){const it=d.items.find(i=>i.id==t.dataset.di);(it&&it.photos||[]).forEach(delPhoto);d.items=d.items.filter(i=>i.id!=t.dataset.di);save();renderDays()}
 if(t.dataset.dd){
  if(d.items.length&&!(await askConfirm("この日のプランをすべて削除しますか?")))return;
  const c=t.closest("[data-day]");c.style.maxHeight=c.offsetHeight+"px";void c.offsetHeight;c.classList.add("rm");
  setTimeout(()=>{d.items.forEach(i=>(i.photos||[]).forEach(delPhoto));trip.days=trip.days.filter(x=>x.id!=d.id);if(!trip.days.length)trip.days.push({id:Date.now(),date:"",items:[]});save();renderDays()},470);
 }
};
$("days").onchange=e=>{if(e.target.dataset.tm){for(const d of trip.days){const it=d.items.find(i=>i.id==e.target.dataset.tm);if(it){it.time=e.target.value;save();renderDays();break}}return}if(e.target.dataset.date){findDay(e.target).date=e.target.value;save();renderDays()}};
$("dadd").onclick=()=>{trip.days.push({id:Date.now(),date:"",items:[]});save();renderDays()};
$("tname").oninput=()=>{trip.name=$("tname").value;save()};
// finish trip / record
let hist=ld("history",[]),tripCount=ld("tripCount",0);
function renderRec(){
 $("tcnt").textContent=tripCount;
 $("hist").innerHTML=hist.length?'<div class="gal">'+hist.slice().reverse().map(h=>`<div class="gi">${h.photo?`<div class="frame"><div class="mat"><img data-hp="${h.photo}" alt=""></div></div>`:""}<b>${esc(h.name)}</b><span>${esc(h.date)}</span></div>`).join("")+'</div>':'<p class="note">旅行を終了すると、ここに題名が保存されます。</p>';
 document.querySelectorAll("img[data-hp]").forEach(async im=>{const b=await getPhoto(im.dataset.hp);if(b)im.src=URL.createObjectURL(b);else im.closest(".frame").style.display="none"});
}
$("tend").onclick=async()=>{
 if(!(await askConfirm("この旅行を終了して、プランを初期化しますか?題名は「その他」の記録に保存されます。","終了する")))return;
 const all=[];trip.days.forEach(d=>d.items.forEach(i=>(i.photos||[]).forEach(x=>all.push(x))));
 const pick=all.length?all[Math.floor(Math.random()*all.length)]:null;
 all.forEach(x=>{if(x!==pick)delPhoto(x)});
 hist.push({id:Date.now(),name:(trip.name||"").trim()||"題名なしの旅行",date:new Date().toLocaleDateString("ja-JP",{year:"numeric",month:"long",day:"numeric"}),photo:pick});
 tripCount++;sv("history",hist);sv("tripCount",tripCount);
 trip={name:"",days:[{id:Date.now(),date:"",items:[]}]};save();delete planePos.all;
 renderDays();renderRec();window.scrollTo({top:0,behavior:"smooth"});
};
// photos (IndexedDB)
const dbp=new Promise(res=>{try{const r=indexedDB.open("helip",1);r.onupgradeneeded=()=>r.result.createObjectStore("p",{keyPath:"id"});r.onsuccess=()=>res(r.result);r.onerror=()=>res(null)}catch(e){res(null)}});
async function putPhoto(id,blob){const d=await dbp;if(!d)return false;return new Promise(r=>{try{const t=d.transaction("p","readwrite");t.objectStore("p").put({id,blob});t.oncomplete=()=>r(true);t.onerror=()=>r(false)}catch(e){r(false)}})}
async function getPhoto(id){const d=await dbp;if(!d)return null;return new Promise(r=>{try{const q=d.transaction("p").objectStore("p").get(id);q.onsuccess=()=>r(q.result?q.result.blob:null);q.onerror=()=>r(null)}catch(e){r(null)}})}
async function delPhoto(id){const d=await dbp;if(!d)return;try{d.transaction("p","readwrite").objectStore("p").delete(id)}catch(e){}}
async function fillPhotos(){for(const im of document.querySelectorAll("img[data-ph]")){const b=await getPhoto(im.dataset.ph);if(b)im.src=URL.createObjectURL(b);else im.style.display="none"}}
let phTarget=null,vPid=null;
async function addPhoto(file){
 if(!file||!phTarget)return;
 const blob=await shrink(file),pid="p"+Date.now();
 if(!(await putPhoto(pid,blob))){alert("この環境では写真を保存できませんでした");return}
 for(const d of trip.days){const it=d.items.find(i=>i.id==phTarget);if(it){(it.photos=it.photos||[]).push(pid)}}
 save();renderDays();
}
$("fphc").onchange=e=>{addPhoto(e.target.files[0]);e.target.value=""};
$("fphp").onchange=e=>{addPhoto(e.target.files[0]);e.target.value=""};
async function showPhoto(pid){const b=await getPhoto(pid);if(!b)return;vPid=pid;$("vimg").src=URL.createObjectURL(b);$("viewer").classList.remove("hide")}
$("vclose").onclick=()=>$("viewer").classList.add("hide");
$("vdel").onclick=async()=>{if(!vPid||!(await askConfirm("この写真を削除しますか?")))return;delPhoto(vPid);trip.days.forEach(d=>d.items.forEach(i=>{i.photos=(i.photos||[]).filter(x=>x!==vPid)}));save();$("viewer").classList.add("hide");renderDays()};
// accent color
const PAL=["#1f9d57","#2a9d9f","#3a82c4","#7a6a62","#606060","#b32d2d","#b84670","#c0605a","#c99a1a","#8561a8"];
function hexHsl(h){const n=parseInt(h.slice(1),16),r=(n>>16&255)/255,g=(n>>8&255)/255,b=(n&255)/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,d=mx-mn;let H=0,S=0;if(d){S=d/(1-Math.abs(2*l-1));H=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;H=(H*60+360)%360}return[H,S*100,l*100]}
const hsl=(h,s,l)=>`hsl(${Math.round((h%360+360)%360)} ${Math.round(s)}% ${Math.round(l)}%)`;
const AV=["--ac","--acx","--bg","--dot","--bd","--soft","--card","--sub","--a2","--donebg","--b0a","--b0b","--b1a","--b1b","--b2a","--b2b"];
function applyAccent(){
 const h=ld("accent",null),r=document.documentElement.style;
 AV.forEach(v=>r.removeProperty(v));
 if(h){
  const dark=matchMedia("(prefers-color-scheme:dark)").matches,[H,S0]=hexHsl(h),S=Math.min(Math.max(S0,50),72),H2=Math.abs(((H-45+540)%360)-180)<35?H+190:45;
  const ac=dark?hsl(H,Math.max(S0,55),66):hsl(H,Math.max(S0,50),38);
  const set=(k,v)=>r.setProperty(k,v);
  set("--ac",ac);set("--acx",dark?"#0b1220":"#ffffff");
  if(dark){set("--bg",hsl(H,38,8));set("--dot",hsl(H,30,14));set("--bd",hsl(H,28,30));set("--soft",hsl(H,32,18));set("--card",hsl(H,32,13));set("--sub",hsl(H,22,80));set("--a2",hsl(H2,88,58));set("--donebg",hsl(H2,38,17))}

// conversation mode
function setCard(el,main,small,ph){el.className="ct"+(ph?" ph":"");el.textContent=main;if(small){const e=document.createElement("small");e.textContent=small;el.appendChild(e)}}
const tx=()=>UI[$("lang").value];

const LC=["en","zh-CN","hi","es","fr","ar","bn","pt","ru","ur","id","de","pa","sw","tr","vi","it","ko","th","tl"];
function lcode(name){if(name==="日本語")return "ja";return LC[LANG.findIndex(l=>l[0]===name)]}
function apiKey(){return String(ld("akey","")||"").trim()}
async function claudeCall(content,max){
 const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":apiKey(),"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:"claude-haiku-5-5",max_tokens:max||1000,messages:[{role:"user",content}]})});
 if(!r.ok)throw new Error("claude "+r.status);
 const j=await r.json();return j.content.map(c=>c.text||"").join("").trim();
}
function unesc(t){const e=document.createElement("textarea");e.innerHTML=t;return e.value}
async function cvTr(t,from,to){
 if(apiKey())return claudeCall(`次の${from}の文章を自然な${to}に翻訳してください。翻訳結果のみを出力し、説明は不要です。\n\n${t}`);
 const r=await fetch("https://api.mymemory.translated.net/get?q="+encodeURIComponent(t)+"&langpair="+lcode(from)+"|"+lcode(to));
 if(!r.ok)throw new Error("mm "+r.status);
 const j=await r.json();
 if(Number(j.responseStatus)!==200)throw new Error("mm "+j.responseStatus);
 let out=unesc(j.responseData.translatedText).trim();
 if(lcode(to)==="ja"&&!/[\u3040-\u30ff\u3400-\u9fff]/.test(out)){
  const m=(j.matches||[]).map(x=>unesc(String(x.translation||"")).trim()).filter(x=>/[\u3040-\u30ff\u3400-\u9fff]/.test(x));
  if(m.length)out=m[0];else throw new Error("mm no-ja");
 }
 return out;
}
function cvListen(who){
 if(!SR)return;
 if(cvRec){try{cvRec.stop()}catch(e){}return}
 if(!sample){$("tn").textContent="翻訳機能が利用できません。";return}
 const nm=LANG[$("lang").value][0],partner=who==="top",btn=$(partner?"mTop":"mBot"),dest=$(partner?"cBot":"cTop"),T=partner?JP:tx();
 const rec=new SR();rec.lang=partner?LANG[$("lang").value][1]:"ja-JP";rec.interimResults=true;rec.continuous=false;
 let heard="";
 rec.onstart=()=>{cvRec=rec;btn.classList.add("rec");setCard(dest,T[1],"",true);$("tn").textContent=""};
 rec.onresult=e=>{heard="";for(const r of e.results)heard+=r[0].transcript};
 rec.onerror=e=>{$("tn").textContent="音声認識エラー: "+e.error+"(マイクの許可を確認してください)"};
 rec.onend=async()=>{
  cvRec=null;btn.classList.remove("rec");
  if(!heard.trim()){setCard(dest,T[0],"",true);return}
  setCard(dest,T[2],"",true);
  try{const t=partner?await cvTr(heard,nm,"日本語"):await cvTr(heard,"日本語",nm);setCard(dest,t,"",false)}
  catch(e){setCard(dest,T[3],"",true)}
 };
 try{rec.start()}catch(e){$("tn").textContent="マイクを開始できませんでした"}
}

async function shrink(file){
 const bm=await createImageBitmap(file),k=Math.min(1,1280/Math.max(bm.width,bm.height));
 const c=document.createElement("canvas");c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);
 c.getContext("2d").drawImage(bm,0,0,c.width,c.height);
 return new Promise(r=>c.toBlob(r,"image/jpeg",0.85));
}
async function doImg(file){
 if(!file)return;
 try{
  const blob=await shrink(file);
  $("prev").src=URL.createObjectURL(blob);$("prev").classList.remove("hide");
  if(!apiKey()){$("out").textContent="写真の翻訳には、「その他」でClaude APIキーを入力してください。";return}
  $("out").textContent="読み取って翻訳中…";$("tn").textContent="";
  const b64=await new Promise(r=>{const f=new FileReader();f.onload=()=>r(String(f.result).split(",")[1]);f.readAsDataURL(blob)});
  const t=await claudeCall([{type:"image",source:{type:"base64",media_type:"image/jpeg",data:b64}},{type:"text",text:"この画像に写っている文字(看板、メニュー、書類など)を読み取り、日本語に翻訳してください。次の形式で出力してください。\n【原文】読み取った文字\n【日本語訳】翻訳結果\n文字が見当たらない場合は、その旨を一言だけ書いてください。"}],1500);
  $("out").textContent=t;
 }catch(e){$("out").textContent="";$("tn").textContent="画像を翻訳できませんでした("+(e.message||"error")+")"}
}
$("fcam").onchange=e=>{doImg(e.target.files[0]);e.target.value=""};
